name: Commit
on: [push]

env:
  CI_NAME: Commit CI
  BUILD_ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch source code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get branch name
        id: vars
        run: |
          echo ${GITHUB_REF#refs/*/}
          echo CI_BRANCH=${GITHUB_REF#refs/*/} >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v4
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Fetch submodules
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: |
          git submodule update --init --recursive

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release Trime
        run: |
          ./gradlew :app:assembleRelease

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APK with clear filename
        run: |
          cd app/build/outputs/apk/release
          original_apk=$(ls *arm64-v8a-*.apk | head -1)
          new_apk="shengyun-rime-arm64-v8a-${{ steps.version.outputs.date }}-${{ steps.version.outputs.commit_short }}.apk"
          mv "$original_apk" "$new_apk"
          echo "APK renamed to: $new_apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: shengyun-rime-arm64-v8a
          path: app/build/outputs/apk/release/shengyun-rime-arm64-v8a-*.apk
          retention-days: 90

      - name: Delete older pre-releases
        if: github.ref == 'refs/heads/develop'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });
            
            for (const release of releases.data) {
              if (release.prerelease) {
                console.log(`Deleting release ${release.tag_name}`);
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });
                
                try {
                  console.log(`Deleting tag ${release.tag_name}`);
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${release.tag_name}`
                  });
                } catch (error) {
                  console.error(`Failed to delete tag ${release.tag_name}: ${error.message}`);
                }
              }
            }

      - name: Create automatic release
        if: github.ref == 'refs/heads/develop'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: "v${{ steps.version.outputs.date }}"
          prerelease: true
          title: "Shengyun Rime v${{ steps.version.outputs.date }}"
          files: |
            app/build/outputs/apk/release/shengyun-rime-arm64-v8a-*.apk
