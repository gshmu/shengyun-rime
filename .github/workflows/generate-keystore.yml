name: Generate Keystore
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          # Generate a self-signed keystore
          keytool -genkeypair \
            -alias shengyun-rime \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore shengyun-rime.jks \
            -storepass shengyun2025 \
            -keypass shengyun2025 \
            -dname "CN=gshmu, OU=Development, O=gshmu.com, L=Unknown, ST=Unknown, C=CN"

          # Convert to base64 for GitHub Secrets
          base64 -w 0 shengyun-rime.jks > keystore.base64

          echo "=========================================="
          echo "Keystore generated successfully!"
          echo "=========================================="
          echo ""
          echo "Please add the following to GitHub Secrets:"
          echo ""
          echo "1. SIGNING_KEY (paste the content below):"
          cat keystore.base64
          echo ""
          echo ""
          echo "2. KEY_STORE_PASSWORD: shengyun2025"
          echo "3. ALIAS: shengyun-rime"
          echo "4. KEY_PASSWORD: shengyun2025"
          echo ""
          echo "=========================================="
          echo "How to add secrets:"
          echo "1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo "2. Click 'New repository secret'"
          echo "3. Add each secret above"
          echo "=========================================="

      - name: Upload keystore info
        uses: actions/upload-artifact@v5
        with:
          name: keystore-info
          path: keystore.base64
          retention-days: 1
