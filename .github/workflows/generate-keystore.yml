name: Generate Keystore
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate keystore with random password
        run: |
          # Generate random passwords (32 bytes base64 = very strong)
          STORE_PASS=$(openssl rand -base64 32)
          KEY_PASS=$(openssl rand -base64 32)

          # Generate keystore
          keytool -genkeypair \
            -alias shengyun-rime \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore shengyun-rime.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=gshmu, OU=Development, O=gshmu.com, L=Unknown, ST=Unknown, C=CN"

          # Convert to base64
          SIGNING_KEY=$(base64 -w 0 shengyun-rime.jks)

          # Save to file for gh CLI to use (masked in logs)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$SIGNING_KEY"

          # Create setup script
          cat > setup-secrets.sh << 'SCRIPT_END'
#!/bin/bash
set -e

echo "Setting up GitHub Secrets for shengyun-rime..."

# Read from environment variables set by user
gh secret set SIGNING_KEY --body "$SIGNING_KEY" --repo gshmu/shengyun-rime
gh secret set KEY_STORE_PASSWORD --body "$KEY_STORE_PASSWORD" --repo gshmu/shengyun-rime
gh secret set ALIAS --body "shengyun-rime" --repo gshmu/shengyun-rime
gh secret set KEY_PASSWORD --body "$KEY_PASSWORD" --repo gshmu/shengyun-rime

echo "✓ All secrets configured successfully!"
SCRIPT_END

          chmod +x setup-secrets.sh

          # Save passwords to files for manual use
          echo "$SIGNING_KEY" > signing-key.txt
          echo "$STORE_PASS" > store-password.txt
          echo "$KEY_PASS" > key-password.txt

          echo "✓ Keystore generated successfully"
          echo "✓ Download artifacts and run: SIGNING_KEY=\$(cat signing-key.txt) KEY_STORE_PASSWORD=\$(cat store-password.txt) KEY_PASSWORD=\$(cat key-password.txt) ./setup-secrets.sh"

      - name: Upload keystore configuration
        uses: actions/upload-artifact@v5
        with:
          name: keystore-secure-setup
          path: |
            setup-secrets.sh
            signing-key.txt
            store-password.txt
            key-password.txt
          retention-days: 1

