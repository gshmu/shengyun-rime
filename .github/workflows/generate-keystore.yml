name: Generate Keystore
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore with random password
        run: |
          # Generate random passwords
          STORE_PASS=$(openssl rand -base64 32)
          KEY_PASS=$(openssl rand -base64 32)

          # Generate keystore
          keytool -genkeypair \
            -alias shengyun-rime \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore shengyun-rime.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=gshmu, OU=Development, O=gshmu.com, L=Unknown, ST=Unknown, C=CN"

          # Convert to base64
          SIGNING_KEY=$(base64 -w 0 shengyun-rime.jks)

          # Output as GitHub outputs (masked)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$SIGNING_KEY"
          echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT
          echo "signing_key=$SIGNING_KEY" >> $GITHUB_OUTPUT

          echo "✓ Keystore generated with secure random passwords"
          echo "✓ All sensitive data is masked in logs"
        id: keygen

      - name: Set GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ steps.keygen.outputs.signing_key }}" | gh secret set SIGNING_KEY --repo ${{ github.repository }}
          echo "${{ steps.keygen.outputs.store_pass }}" | gh secret set KEY_STORE_PASSWORD --repo ${{ github.repository }}
          echo "shengyun-rime" | gh secret set ALIAS --repo ${{ github.repository }}
          echo "${{ steps.keygen.outputs.key_pass }}" | gh secret set KEY_PASSWORD --repo ${{ github.repository }}

          echo "✓ All secrets configured successfully"
          echo "✓ Passwords are NOT stored anywhere except GitHub Secrets"

